{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-8">
    <h2 class="text-2xl font-bold mb-2 text-center text-blue-600">Forgot Password</h2>
    <p class="text-gray-500 text-center mb-6">Enter your email and we'll send you a reset link.</p>

    <form method="POST">
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Email</label>
            <input type="email" name="email" required
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <button type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
            Send Reset Link
        </button>
    </form>

    <p class="text-center mt-4 text-gray-600">
        <a href="{{ url_for('auth.login') }}" class="text-blue-600 hover:underline">Back to Login</a>
    </p>
</div>
{% endblock %}
