{% extends 'base.html' %}

{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-lg shadow p-8">
    <h2 class="text-2xl font-bold mb-2 text-gray-800">Send Quote</h2>
    <p class="text-gray-500 mb-6">Sending quote to <strong>{{ job.client_name }}</strong></p>

    <form method="POST">
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Description of work</label>
            <textarea name="quote_description" rows="3" required
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500"
                placeholder="e.g. Full electrical installation including wiring and fuse box"></textarea>
        </div>

        <div class="mb-6">
            <label class="block text-gray-700 mb-2">Price (£)</label>
            <input type="number" name="quote_price" min="0" step="0.01" required
                value="{{ job.price or '' }}"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="flex gap-4">
            <button type="submit"
                class="flex-1 bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                📤 Send Quote
            </button>
            <a href="{{ url_for('main.dashboard') }}"
                class="flex-1 text-center border border-gray-300 py-2 rounded hover:bg-gray-50">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
