{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-8">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">Business Settings</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="bg-green-100 border border-green-400 text-green-800 px-4 py-3 rounded mb-4">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <!-- Business Type -->
        <div class="mb-6">
            <label class="block text-gray-700 font-semibold mb-2">Business Type</label>
            <div class="flex gap-4">
                <label class="flex items-center gap-2">
                    <input type="radio" name="business_type" value="sole_trader"
                        {{ 'checked' if not business or business.business_type == 'sole_trader' }}
                        onchange="toggleBusinessType(this.value)">
                    Sole Trader
                </label>
                <label class="flex items-center gap-2">
                    <input type="radio" name="business_type" value="limited_company"
                        {{ 'checked' if business and business.business_type == 'limited_company' }}
                        onchange="toggleBusinessType(this.value)">
                    Limited Company
                </label>
            </div>
        </div>

        <!-- Business Details -->
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Legal Name</label>
            <input type="text" name="legal_name" value="{{ business.legal_name or '' if business else '' }}"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Trading Name</label>
            <input type="text" name="trading_name" value="{{ business.trading_name or '' if business else '' }}"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Business Address</label>
            <textarea name="address" rows="3"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">{{ business.address or '' if business else '' }}</textarea>
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Phone</label>
            <input type="text" name="phone" value="{{ business.phone or '' if business else '' }}"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Business Email</label>
            <input type="email" name="business_email" value="{{ business.business_email or '' if business else '' }}"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <!-- Company Number (Ltd only) -->
        <div id="company_number_field" class="mb-4" style="{{ 'display:none' if not business or business.business_type != 'limited_company' else '' }}">
            <label class="block text-gray-700 mb-2">Company Registration Number</label>
            <input type="text" name="company_number" value="{{ business.company_number or '' if business else '' }}"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

               <!-- Tax -->
        <div class="mb-4 border-t pt-4 mt-4">
            <label class="block text-gray-700 font-semibold mb-2">Tax Country</label>
            <select name="tax_country" id="tax_country" onchange="toggleTaxCountry(this.value)"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 mb-3">
                <option value="UK" {{ 'selected' if not business or business.tax_country == 'UK' }}>🇬🇧 UK — VAT</option>
                <option value="USA" {{ 'selected' if business and business.tax_country == 'USA' }}>🇺🇸 USA — Sales Tax</option>
                <option value="RO" {{ 'selected' if business and business.tax_country == 'RO' }}>🇷🇴 România — TVA</option>
            </select>

            <label class="flex items-center gap-2 mb-3">
                <input type="checkbox" name="vat_registered" id="vat_registered"
                    {{ 'checked' if business and business.vat_registered }}
                    onchange="toggleVAT(this.checked)">
                <span id="tax_registered_label">VAT Registered</span>
            </label>

            <div id="vat_fields" style="{{ 'display:none' if not business or not business.vat_registered else '' }}">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" id="tax_number_label">VAT Number</label>
                    <input type="text" name="vat_number" value="{{ business.vat_number or '' if business else '' }}"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" id="tax_rate_label">VAT Rate (%)</label>
                    <input type="number" name="vat_rate" id="vat_rate_input" step="0.01"
                        value="{{ business.vat_rate or '20.00' if business else '20.00' }}"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
                </div>
            </div>
        </div>
           

        <!-- Invoice Settings -->
        <div class="mb-4 border-t pt-4 mt-4">
            <label class="block text-gray-700 font-semibold mb-2">Invoice Settings</label>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Invoice Prefix</label>
                <input type="text" name="invoice_prefix" value="{{ business.invoice_prefix or 'INV' if business else 'INV' }}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Next Invoice Number</label>
                <input type="number" name="next_invoice_number" value="{{ business.next_invoice_number or 1 if business else 1 }}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Payment Terms</label>
                <select name="payment_terms"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
                    <option value="0" {{ 'selected' if business and business.payment_terms == '0' }}>Due on receipt</option>
                    <option value="7" {{ 'selected' if business and business.payment_terms == '7' }}>7 days</option>
                    <option value="14" {{ 'selected' if business and business.payment_terms == '14' }}>14 days</option>
                    <option value="30" {{ 'selected' if business and business.payment_terms == '30' or not business }}>30 days</option>
                </select>
            </div>
        </div>

        <!-- Bank Details -->
        <div class="mb-4 border-t pt-4 mt-4">
            <label class="block text-gray-700 font-semibold mb-2">Payment Details</label>
            <label class="flex items-center gap-2 mb-3">
                <input type="checkbox" name="show_bank_details"
                    {{ 'checked' if business and business.show_bank_details }}>
                Show bank details on invoices
            </label>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Account Name</label>
                <input type="text" name="account_name" value="{{ business.account_name or '' if business else '' }}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Sort Code</label>
                <input type="text" name="sort_code" value="{{ business.sort_code or '' if business else '' }}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Account Number</label>
                <input type="text" name="account_number" value="{{ business.account_number or '' if business else '' }}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>
        </div>

        <button type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 mt-4">
            Save Settings
        </button>
    
    </form>
            
    

    <!-- Language & Currency -->
    <div class="mb-6 border-t pt-4 mt-4 flex gap-8">
        <div>
            <label class="block text-gray-700 font-semibold mb-2">{{ _('Language') }}</label>
            <form method="POST" action="{{ url_for('main.set_language', next=request.full_path) }}">
               <script>
function toggleBusinessType(type) {
    const field = document.getElementById('company_number_field');
    field.style.display = type === 'limited_company' ? 'block' : 'none';
}

const TAX_LABELS = {
    UK: { registered: 'VAT Registered', number: 'VAT Number', rate: 'VAT Rate (%)', defaultRate: '20.00' },
    USA: { registered: 'Collect Sales Tax', number: 'Sales Tax ID', rate: 'Sales Tax Rate (%)', defaultRate: '0.00' },
    RO: { registered: 'Plătitor TVA', number: 'Număr TVA', rate: 'Cota TVA (%)', defaultRate: '19.00' }
};

function toggleTaxCountry(country) {
    const labels = TAX_LABELS[country] || TAX_LABELS.UK;
    document.getElementById('tax_registered_label').textContent = labels.registered;
    document.getElementById('tax_number_label').textContent = labels.number;
    document.getElementById('tax_rate_label').textContent = labels.rate;
    const rateInput = document.getElementById('vat_rate_input');
    if (!rateInput.dataset.saved) {
        rateInput.value = labels.defaultRate;
        rateInput.dataset.saved = '1';
    }
}

function toggleVAT(checked) {
    const fields = document.getElementById('vat_fields');
    fields.style.display = checked ? 'block' : 'none';
}
</script>
                </select>
            </form>
        </div>
        <div>
            <label class="block text-gray-700 font-semibold mb-2">{{ _('Currency') }}</label>
            <form method="POST" action="{{ url_for('main.set_currency', next=request.full_path) }}">
                <select name="currency" onchange="this.form.submit()"
                    class="border border-gray-300 rounded px-3 py-2">
                    <option value="GBP" {{ 'selected' if current_user.currency == 'GBP' else '' }}>£ GBP</option>
                    <option value="RON" {{ 'selected' if current_user.currency == 'RON' else '' }}>lei RON</option>
                    <option value="EUR" {{ 'selected' if current_user.currency == 'EUR' else '' }}>€ EUR</option>
                    <option value="USD" {{ 'selected' if current_user.currency == 'USD' else '' }}>$ USD</option>
                </select>
            </form>
        </div>
    </div>
</div>

<script>
function toggleBusinessType(type) {
    const field = document.getElementById('company_number_field');
    field.style.display = type === 'limited_company' ? 'block' : 'none';
}

function toggleVAT(checked) {
    const fields = document.getElementById('vat_fields');
    fields.style.display = checked ? 'block' : 'none';
}
</script>
{% endblock %}
