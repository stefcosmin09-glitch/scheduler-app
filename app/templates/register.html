{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-8">
    <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">{{ _('New Account') }}</h2>

    <form method="POST">
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">{{ _('Username') }}</label>
            <input type="text" name="username" required
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 mb-2">{{ _('Email') }}</label>
            <input type="email" name="email" required
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="mb-6">
            <label class="block text-gray-700 mb-2">{{ _('Password') }}</label>
            <input type="password" name="password" required
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <button type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
            {{ _('Create Account') }}
        </button>
    </form>

    <p class="text-center mt-4 text-gray-600">
        {{ _('Already have an account?') }}
        <a href="{{ url_for('auth.login') }}" class="text-blue-600 hover:underline">{{ _('Log in') }}</a>
    </p>
</div>
{% endblock %}
