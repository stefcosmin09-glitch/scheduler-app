{% if TESTIMONIALS %}
<section class="ts-reveal py-12">
    <h2 class="text-2xl sm:text-3xl font-extrabold text-center text-gray-900 mb-8">What tradespeople say</h2>
    <div class="grid md:grid-cols-3 gap-6">
        {% for t in TESTIMONIALS %}
        <figure class="bg-white rounded-2xl shadow-sm p-6">
            <blockquote class="text-gray-700 italic mb-4">"{{ t.quote }}"</blockquote>
            <figcaption class="text-sm text-gray-500">
                {% if t.photo %}<img src="{{ url_for('static', filename=t.photo) }}" alt="{{ t.name }}" class="w-10 h-10 rounded-full inline-block mr-2" loading="lazy">{% endif %}
                <span class="font-semibold text-gray-900">{{ t.name }}</span> - {{ t.trade }}, {{ t.town }}
            </figcaption>
        </figure>
        {% endfor %}
    </div>
</section>
{% endif %}
