{% extends 'base.html' %}

{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-lg shadow p-8">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">Job nou</h2>

    <form method="POST">
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Nume client</label>
            <input type="text" name="client_name" required
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Email client</label>
            <input type="email" name="client_email"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="mb-4">
                      <label class="block text-gray-700 mb-2">{{ _('Address') }}</label>
            <input type="text" name="address" required
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Tip activitate</label>
            <select name="activity_type"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
                {% for value, label in activity_types %}
                <option value="{{ value }}">{{ _(label) }}</option>
                {% endfor %}
            </select>
        </div>

               <div class="mb-4">
            <label class="block text-gray-700 mb-2">{{ _('Price') }}</label>
            <div class="flex gap-2">
                <input type="number" name="price" min="0" step="0.01" placeholder="0.00"
                    class="flex-1 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
                <select name="price_currency"
                    class="border border-gray-300 rounded px-3 py-2 bg-white">
                    <option value="GBP" selected>£ GBP</option>
                    <option value="RON">lei RON</option>
                    <option value="EUR">€ EUR</option>
                    <option value="USD">$ USD</option>
                </select>
            </div>
        </div>

        <div class="mb-4">
                        <label class="block text-gray-700 mb-2">{{ _('Date & Time') }}</label>
            <input type="datetime-local" name="date" required
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="mb-6">
            <label class="block text-gray-700 mb-2">Descriere</label>
            <textarea name="description" rows="3"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <div class="flex gap-4">
            <button type="submit"
                class="flex-1 bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                Salvează job
            </button>
            <a href="{{ url_for('main.dashboard') }}"
                class="flex-1 text-center border border-gray-300 py-2 rounded hover:bg-gray-50">
                Anulează
            </a>
        </div>
    </form>
</div>
{% endblock %}
