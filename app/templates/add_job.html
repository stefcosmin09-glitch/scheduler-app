{% extends 'base.html' %}

{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-lg shadow p-8">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">{{ _('New Job') }}</h2>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">{{ _('Client Name') }}</label>
            <input type="text" name="client_name" required
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 mb-2">{{ _('Client Email') }}</label>
            <input type="email" name="client_email"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="mb-4">
                      <label class="block text-gray-700 mb-2">{{ _('Address') }}</label>
            <input type="text" name="address" required
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 mb-2">{{ _('Activity Type') }}</label>
            <select name="activity_type"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
                {% for value, label in activity_types %}
                <option value="{{ value }}">{{ _(label) }}</option>
                {% endfor %}
            </select>
        </div>

               <div class="mb-4">
            <label class="block text-gray-700 mb-2">{{ _('Price') }}</label>
            <div class="flex gap-2">
                <input type="number" name="price" min="0" step="0.01" placeholder="0.00"
                    class="flex-1 min-w-0 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
                <select name="price_currency"
                    class="border border-gray-300 rounded px-3 py-2 bg-white">
                    <option value="GBP" selected>£ GBP</option>
                    <option value="RON">lei RON</option>
                    <option value="EUR">€ EUR</option>
                    <option value="USD">$ USD</option>
                </select>
            </div>
        </div>

        <div class="mb-4">
                        <label class="block text-gray-700 mb-2">{{ _('Date & Time') }}</label>
            <input type="datetime-local" name="date" required
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 mb-2">{{ _('How long do you expect this to take?') }}</label>
            <div class="flex items-center gap-2">
                <input type="number" name="duration_minutes" min="15" max="1440" step="15" value="60"
                    class="w-32 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
                <span class="text-gray-600 text-sm">{{ _('minutes') }}</span>
            </div>
            <p class="text-xs text-gray-500 mt-1">{{ _('Used as the end time in your calendar feed.') }}</p>
        </div>

        <div class="mb-6">
            <label class="block text-gray-700 mb-2">{{ _('Description') }}</label>
            <textarea name="description" rows="3"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <div class="flex gap-4">
            <button type="submit"
                class="flex-1 bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                {{ _('Save Job') }}
            </button>
            <a href="{{ url_for('main.dashboard') }}"
                class="flex-1 text-center border border-gray-300 py-2 rounded hover:bg-gray-50">
                {{ _('Cancel') }}
            </a>
        </div>
    </form>
</div>
{% endblock %}
