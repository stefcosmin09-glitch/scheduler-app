[pytest]
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    # The app still calls datetime.utcnow() throughout, which Python 3.12
    # deprecates. It is real debt, tracked as the timezone refactor, but failing
    # the whole suite over it would just teach everyone to ignore the filter.
    default::DeprecationWarning
    default::sqlalchemy.exc.LegacyAPIWarning
